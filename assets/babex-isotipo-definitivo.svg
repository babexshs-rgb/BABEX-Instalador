<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Babex">

  <!--
    BABEX · Isotipo en pastilla

    Para el icono de la app, el favicon y cualquier sitio donde el
    logotipo completo no se leería. La ventana se agranda ligeramente
    respecto al logotipo horizontal: por debajo de 24 píxeles, cuatro
    cuadros pequeños se empastan en una mancha.
  -->

  <rect x="0" y="0" width="120" height="120" rx="28" fill="#16294A"/>

  <path d="M22 80 Q60 106 98 80"
        fill="none" stroke="#5C9DFF" stroke-width="7.5"
        stroke-linecap="round"/>

  <path d="M32 76 L32 51 L60 27 L88 51 L88 76 Z"
        fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#ffffff">
    <rect x="50" y="53" width="8" height="8" rx="1.3"/>
    <rect x="62" y="53" width="8" height="8" rx="1.3"/>
    <rect x="50" y="65" width="8" height="8" rx="1.3"/>
    <rect x="62" y="65" width="8" height="8" rx="1.3"/>
  </g>

</svg>
