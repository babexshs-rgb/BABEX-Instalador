<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 136" width="440" height="136"
     role="img" aria-label="Babex · Smart Home Solutions">

  <!--
    ==========================================================
    BABEX · Logotipo definitivo (fondos claros)
    ==========================================================

    Azul marino  #16294A   estructura, la casa, lo que permanece
    Azul señal   #2F7BF6   el arco, la conexión, lo que la sostiene

    El arco se mantiene porque es el gesto que ya identifica a BABEX,
    pero cambia de color y de significado: en azul deja de leerse como
    un adorno y pasa a ser la señal que envuelve y sostiene la casa.

    Es más ancho que la vivienda a propósito: el servicio empieza
    antes de entrar por la puerta y sigue después de salir.
    ==========================================================
  -->

  <g id="isotipo" transform="translate(6, 12)">

    <!-- Arco: se dibuja primero para que la casa quede por encima -->
    <path d="M2 76 Q52 116 102 76"
          fill="none" stroke="#2F7BF6" stroke-width="8.5"
          stroke-linecap="round"/>

    <!-- Casa: tejado y paredes, cerrada por la base -->
    <path d="M14 74 L14 46 L52 12 L90 46 L90 74 Z"
          fill="none" stroke="#16294A" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ventana de cuatro cuadros -->
    <g fill="#16294A">
      <rect x="42" y="48" width="8.5" height="8.5" rx="1.4"/>
      <rect x="54" y="48" width="8.5" height="8.5" rx="1.4"/>
      <rect x="42" y="60" width="8.5" height="8.5" rx="1.4"/>
      <rect x="54" y="60" width="8.5" height="8.5" rx="1.4"/>
    </g>

  </g>

  <!-- Marca -->
  <text x="130" y="78"
        font-family="Poppins, Montserrat, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="600" fill="#16294A">Babex</text>

  <!-- Claim -->
  <text x="134" y="104"
        font-family="Poppins, Montserrat, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="500" letter-spacing="1.1" fill="#2F7BF6">Smart Home Solutions</text>

</svg>
