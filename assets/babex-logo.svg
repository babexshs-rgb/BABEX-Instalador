<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 132" width="420" height="132"
     role="img" aria-label="Babex · Smart Home Solutions">

  <!--
    BABEX · Logotipo principal (fondos claros)

    Colores de marca:
      Azul marino  #16294A
      Dorado       #C1975B

    El isotipo es una casa abierta: el contorno en azul marino dibuja
    tejado y paredes, y el arco dorado cierra la base. La ventana de
    cuatro cuadros aporta el detalle doméstico.
  -->

  <g id="isotipo" transform="translate(4, 10)">

    <!-- Contorno de la casa: paredes y tejado -->
    <path d="M9 74 L9 45 L52 9 L95 45 L95 74"
          fill="none" stroke="#16294A" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arco dorado: cierra la base de la casa -->
    <path d="M9 74 Q52 108 95 74"
          fill="none" stroke="#C1975B" stroke-width="8"
          stroke-linecap="round"/>

    <!-- Ventana de cuatro cuadros -->
    <g fill="#16294A">
      <rect x="41" y="47" width="9" height="9" rx="1.2"/>
      <rect x="54" y="47" width="9" height="9" rx="1.2"/>
      <rect x="41" y="60" width="9" height="9" rx="1.2"/>
      <rect x="54" y="60" width="9" height="9" rx="1.2"/>
    </g>

  </g>

  <!-- Marca -->
  <text x="122" y="76"
        font-family="Poppins, Montserrat, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="600" fill="#16294A">Babex</text>

  <!-- Claim -->
  <text x="126" y="103"
        font-family="Poppins, Montserrat, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="500" letter-spacing="0.6" fill="#C1975B">Smart Home Solutions</text>

</svg>
