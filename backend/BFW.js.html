    BFW.Router.current = "dashboard";

    BFW.Router.go = function(view){

        // Vacía el buscador de todos los módulos al cambiar de pantalla,
        // para que no se quede un filtro puesto de una visita anterior.
        ["Personas","Inmuebles","Casos","Empresas","Agenda","Documentos","Administracion"].forEach(function(modulo){

            if(typeof BFW[modulo] !== "undefined" && typeof BFW[modulo].filtro !== "undefined"){

                BFW[modulo].filtro = "";

            }

        });

        BFW.Router.current = view;

        BFW.App.render();

    };

    /**
     * Pantalla a la que hay que regresar al pulsar Cancelar/Volver.
     * La rellenan los accesos directos del panel (y cualquier sitio que
     * lleve al usuario a otro módulo para hacer una sola cosa), para
     * que al terminar no se quede tirado en un módulo al que no había
     * entrado por su propio pie.
     */
    BFW.Router.volverA = null;

    /**
     * Lleva a otro módulo recordando de dónde se venía, y ejecuta allí
     * la acción indicada (por ejemplo, abrir el formulario de "nuevo").
     */
    BFW.Router.accionRapida = function(view, accion){

        BFW.Router.volverA = BFW.Router.current;
        BFW.Router.current = view;

        if(typeof accion === "function"){

            accion();

        } else {

            BFW.App.render();

        }

    };

    /**
     * Si había una pantalla pendiente de regreso, vuelve a ella y
     * devuelve true. Si no, devuelve false y cada módulo sigue con su
     * comportamiento normal (volver a su propio listado).
     */
    /**
     * Abre la ficha de un registro concreto en su módulo, venga de
     * donde venga (ficha de persona, buscador, panel...).
     *
     * Los módulos buscan el registro dentro de sus propios datos, así
     * que si nunca se ha entrado en ese módulo hay que cargarlos antes
     * o seleccionar() no encuentra nada.
     *
     * Recuerda de dónde se venía, para que "Volver" regrese ahí.
     */
    BFW.irAFicha = function(modulo, id){

        const nombres = {
            personas:   "Personas",
            inmuebles:  "Inmuebles",
            casos:      "Casos",
            empresas:   "Empresas",
            agenda:     "Agenda",
            documentos: "Documentos"
        };

        const M = BFW[nombres[modulo]];

        BFW.Router.volverA = BFW.Router.current;
        BFW.Router.current = modulo;

        if(!M || typeof M.seleccionar !== "function"){

            BFW.App.render();
            return;

        }

        // Se usa el cargador completo del módulo, no solo su listado
        // principal.
        //
        // Antes se pedía únicamente M.data y se seleccionaba: la ficha
        // aparecía sin cliente, sin inmueble y sin caso, porque esos
        // datos viven en otras listas del propio módulo que nadie había
        // pedido. Cada módulo sabe qué necesita; aquí solo se le dice
        // que lo cargue.
        BFW.asegurarDatos(modulo, function(){

            M.seleccionar(id);

        });

    };

    /**
     * Evita que una carga en curso se dispare otra vez.
     *
     * Mientras un módulo se está cargando, la pantalla muestra
     * "Cargando..." — y cada repintado vuelve a llamar al cargador.
     * Sin esto, cinco repintados son cinco tandas de peticiones a la
     * vez, y la última en llegar puede pisar a la primera.
     *
     * Devuelve true si hay que abortar porque ya se está cargando; el
     * callback recibido se guarda y se ejecuta cuando termine la carga
     * que ya estaba en marcha.
     *
     * Uso, al principio de cada cargarTodo:
     *
     *     if(BFW.yaSeEstaCargando(BFW.Agenda, callback)) return;
     *     ... y al terminar:  BFW.cargaTerminada(BFW.Agenda);
     */
    BFW.yaSeEstaCargando = function(M, callback){

        if(M._cargandoTodo){

            if(callback){

                M._colaDeCarga = M._colaDeCarga || [];
                M._colaDeCarga.push(callback);

            }

            return true;

        }

        M._cargandoTodo = true;
        M._colaDeCarga = [];

        return false;

    };

    BFW.cargaTerminada = function(M){

        M._cargandoTodo = false;

        const cola = M._colaDeCarga || [];

        M._colaDeCarga = [];

        cola.forEach(function(fn){ fn(); });

    };

    /**
     * Se asegura de que un módulo tenga TODO lo que necesita para
     * pintarse, y solo entonces ejecuta el callback.
     *
     * Cada módulo declara su propio cargador; si no lo tiene, se cae a
     * pedir su listado principal.
     */
    BFW.asegurarDatos = function(modulo, alTerminar){

        const nombres = {
            personas:   "Personas",
            inmuebles:  "Inmuebles",
            casos:      "Casos",
            empresas:   "Empresas",
            agenda:     "Agenda",
            documentos: "Documentos"
        };

        const M = BFW[nombres[modulo]];

        if(!M){

            alTerminar();
            return;

        }

        // Cargador propio del módulo (carga el listado y todo lo
        // relacionado de una vez).
        if(typeof M.cargarTodo === "function"){

            M.cargarTodo(alTerminar);
            return;

        }

        // Si ya tiene su listado, se da por bueno.
        if(Array.isArray(M.data)){

            alTerminar();
            return;

        }

        const cargadores = {
            personas:   BFW.API.getPersonas,
            inmuebles:  BFW.API.getInmuebles,
            casos:      BFW.API.getCasos,
            empresas:   BFW.API.getEmpresas,
            agenda:     BFW.API.getAgenda,
            documentos: BFW.API.getDocumentos
        };

        const cargar = cargadores[modulo];

        if(!cargar){

            alTerminar();
            return;

        }

        cargar(function(datos){

            M.data = Array.isArray(datos) ? datos : [];
            alTerminar();

        });

    };

    BFW.Router.regresar = function(){

        if(!BFW.Router.volverA) return false;

        const destino = BFW.Router.volverA;

        BFW.Router.volverA = null;
        BFW.Router.current = destino;

        BFW.App.render();

        return true;

    };

    BFW.App.render = function(){

        // Guarda qué campo tenía el foco (y la posición del cursor) antes
        // de repintar. Sin esto, cada letra escrita en un buscador vuelve
        // a crear el input desde cero y el navegador le quita el foco,
        // dejando escribir solo un carácter cada vez.
        const elementoActivo = document.activeElement;
        let focoId = null;
        let seleccionInicio = null;
        let seleccionFin = null;

        if(elementoActivo && elementoActivo.id &&
           (elementoActivo.tagName === "INPUT" || elementoActivo.tagName === "TEXTAREA")){

            focoId = elementoActivo.id;
            seleccionInicio = elementoActivo.selectionStart;
            seleccionFin = elementoActivo.selectionEnd;

        }

        // Los instaladores no ven el panel de oficina: la app entera es
        // para ellos la vista de campo, con su propia estructura (sin
        // menú lateral ni cabecera de escritorio).
        if(BFW.Auth.usuario && BFW.Auth.usuario.rol === "Instalador" && typeof BFW.Instalador !== "undefined"){

            document.getElementById("app").innerHTML = BFW.Instalador.render();

            return;

        }

        let html="";

        switch(BFW.Router.current){

            case "personas":

                html = BFW.Personas.render();

                break;

            case "inmuebles":

                html = BFW.Inmuebles.render();

                break;

            case "casos":

                html = BFW.Casos.render();

                break;

            case "empresas":

                html = BFW.Empresas.render();

                break;

            case "agenda":

                html = BFW.Agenda.render();

                break;

            case "documentos":

                html = BFW.Documentos.render();

                break;

            case "buscador":

                html = BFW.Buscador.render();

                break;

            case "catalogo":

                html = BFW.Catalogo.render();

                break;

            case "informes":

                html = BFW.Informes.render();

                break;

            case "administracion":

                // Aunque el menú lateral ya está oculto para Empleados,
                // esto evita que alguien fuerce la navegación (URL,
                // consola) y vea Administración sin ser Admin.
                html = BFW.Auth.esAdmin() ? BFW.Administracion.render() : BFW.Dashboard.render();

                break;

            case "dashboard":

            default:

                html = BFW.Dashboard.render();

                break;

        }

        document.getElementById("app").innerHTML =

            BFW.Layout.render(html);

        if(focoId){

            const elemento = document.getElementById(focoId);

            if(elemento){

                elemento.focus();

                if(typeof seleccionInicio === "number" && elemento.setSelectionRange){

                    try{

                        elemento.setSelectionRange(seleccionInicio, seleccionFin);

                    }catch(e){}

                }

            }

        }

    };

    /**
     * Lee una lista de opciones desde la configuración (hoja CONFIG).
     * configData: el array ya cargado con BFW.API.getConfig (pares clave/valor).
     * clave: p.ej. "CASOS_TIPOS". El valor se espera separado por comas.
     * porDefecto: array a usar si esa clave no existe o está vacía, para que
     * la app siga funcionando igual aunque nadie haya tocado Administración.
     */
    BFW.Config = {};

    BFW.Config.obtenerLista = function(configData, clave, porDefecto){

        if(Array.isArray(configData)){

            const item = configData.find(function(c){ return c.clave === clave; });

            if(item && item.valor){

                const lista = item.valor.split(",")
                    .map(function(v){ return v.trim(); })
                    .filter(function(v){ return v !== ""; });

                if(lista.length > 0){
                    return lista;
                }

            }

        }

        return porDefecto;

    };

    /**
     * Devuelve la fecha de hoy en hora local (Europe/Madrid), no UTC
     */
    BFW.hoyISO = function(){

        const hoy = new Date();
        const mes = String(hoy.getMonth()+1).padStart(2,"0");
        const dia = String(hoy.getDate()).padStart(2,"0");
        return hoy.getFullYear()+"-"+mes+"-"+dia;

    };

    /**
     * Convierte una fecha "YYYY-MM-DD" a formato español "DD/MM/YYYY"
     */
    BFW.formatearFecha = function(fechaISO){

        if(!fechaISO) return "—";

        const partes = fechaISO.split("-");

        if(partes.length !== 3) return fechaISO;

        return partes[2] + "/" + partes[1] + "/" + partes[0];

    };
