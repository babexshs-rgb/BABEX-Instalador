<style>

    /* ==================================================
       CATÁLOGO DE PRODUCTOS
       (usa las variables definidas en Tokens.css.html)
    ================================================== */

.catalogo-barra{

margin-bottom:12px;

}

.catalogo-chips{

display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:6px;

}

.catalogo-chip{

padding:7px 14px;
border-radius:var(--radius-full);
border:1px solid var(--color-border);
background:var(--color-surface);
color:var(--color-text-secondary);
font-size:13px;
font-family:var(--font-family);
cursor:pointer;
transition:.15s;

}

.catalogo-chip:hover{

border-color:var(--color-primary-500);

}

.catalogo-select-familia{

height:34px;
width:auto;
min-width:200px;
padding:0 10px;
font-size:13px;

}

.catalogo-chip.activo{

background:rgba(59,130,246,.12);
border-color:var(--color-primary-500);
color:var(--color-primary-500);
font-weight:700;

}

/*==================================================
LISTA
==================================================*/

.catalogo-lista{

display:flex;
flex-direction:column;
gap:8px;
padding-bottom:24px;

}

.catalogo-fila{

display:flex;
align-items:center;
gap:16px;
padding:12px 14px;
background:var(--color-surface);
border:1px solid var(--color-border);
border-radius:var(--radius-sm);

}

.catalogo-fila-inactiva{

opacity:.55;

}

.catalogo-fila-datos{

flex:1;
min-width:0;

}

.catalogo-fila-nombre{

display:flex;
align-items:center;
gap:8px;
font-size:15px;
font-weight:700;
color:var(--color-text-primary);

}

.catalogo-badge-inactivo{

padding:2px 8px;
border-radius:var(--radius-full);
background:var(--color-surface-hover);
border:1px solid var(--color-border);
font-size:10px;
font-weight:700;
text-transform:uppercase;
letter-spacing:.05em;
color:var(--color-text-muted);

}

.catalogo-fila-meta{

margin-top:3px;
font-size:12px;
color:var(--color-text-muted);

}

.catalogo-fila-precios{

text-align:right;
flex-shrink:0;

}

.catalogo-coste{

font-size:11px;
color:var(--color-text-muted);

}

.catalogo-pvp{

font-size:17px;
font-weight:700;
color:var(--color-text-primary);

}

.catalogo-fila-acciones{

display:flex;
align-items:center;
gap:8px;
flex-shrink:0;

}

/*==================================================
FORMULARIO
==================================================*/

.catalogo-form-grid{

display:grid;
grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
gap:14px;

}

.catalogo-form-grid label,
.admin-panel textarea + label,
.catalogo-form-grid + div label{

display:block;
margin-bottom:4px;
font-size:12px;
font-weight:700;
color:var(--color-text-secondary);

}

.catalogo-form-botones{

display:flex;
justify-content:flex-end;
gap:10px;
margin-top:22px;

}

/*==================================================
MÓVIL
==================================================*/

@media(max-width:700px){

.catalogo-fila{

    flex-wrap:wrap;

}

.catalogo-fila-precios{

    text-align:left;

}

.catalogo-fila-acciones{

    width:100%;
    justify-content:flex-end;

}

.catalogo-form-grid{

    grid-template-columns:1fr;

}

}

</style>
