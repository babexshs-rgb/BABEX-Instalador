<script>
    /*
    ==================================================
    BABEX
    Archivo: Dashboard.html
    Versión: 0.3
    ==================================================
    */
    BFW.Dashboard = {
        casos: null,
        citas: null,
        personas: null,
        estado: null,
        actividad: null,
        // Pipeline de instalaciones (solo Admin: son cifras de dinero
        // por cliente). Para Empleado se deja en [] directamente, sin
        // llamar al servidor, porque el endpoint se lo negaría igualmente.
        pipeline: null,
        bienvenidaVista: false
    };

    /**
     * Últimas acciones registradas (quién ha creado, editado o borrado
     * qué). Se define aquí para no tocar BFW.js.
     */
    BFW.API.getActividad = function(cuantos, callback){

        google.script.run

            .withSuccessHandler(function(datos){

                callback(datos);

            })

            .withFailureHandler(function(error){

                console.error(error);

                callback([]);

            })

            .apiGetActividad(cuantos);

    };

    // Definida después de BFW.UI.js, así que hay que engancharle la
    // barra de progreso a mano.
    BFW.UI.engancharCarga("getActividad");

    /**
     * Pide al servidor el estado real de Drive, Gmail y la base de
     * datos. Se define aquí, y no en BFW.js, para no tener que tocar
     * ese archivo.
     */
    BFW.API.getEstadoSistema = function(callback){

        google.script.run

            .withSuccessHandler(function(datos){

                callback(datos);

            })

            .withFailureHandler(function(error){

                console.error(error);

                // Un fallo aquí no debe romper el panel: se devuelve
                // vacío y cada servicio se pintará como desconocido.
                callback(null);

            })

            .apiEstadoSistema();

    };

    BFW.UI.engancharCarga("getEstadoSistema");

    /**
     * Pipeline de instalaciones: presupuestos desde que el cliente los
     * acepta hasta que se cobran. Solo Admin.
     */
    BFW.API.getPipelineInstalaciones = function(callback){

        google.script.run

            .withSuccessHandler(function(datos){

                callback(datos);

            })

            .withFailureHandler(function(error){

                console.error(error);
                callback(null);

            })

            .apiGetPipelineInstalaciones(BFW.Auth.usuario ? BFW.Auth.usuario.email : "");

    };

    BFW.UI.engancharCarga("getPipelineInstalaciones");

    // Tiempo mínimo (ms) que se queda la pantalla de bienvenida al
    // arrancar, aunque los datos lleguen antes. Solo se aplica la
    // primera vez de la sesión, no cada vez que se vuelve al panel.
    BFW.Dashboard.TIEMPO_BIENVENIDA_MS = 2500;

    BFW.Dashboard.cargarTodo = function(callback){

        // El pipeline es cosa de Admin: a Empleado no se le ni pregunta,
        // el endpoint se lo negaría igualmente.
        const esAdmin = BFW.Auth.esAdmin();

        let pendientes = esAdmin ? 6 : 5;

        function comprobar(){

            pendientes--;

            if(pendientes === 0 && callback){

                callback();

            }

        }

        BFW.API.getCasos(function(datos){

            BFW.Dashboard.casos = Array.isArray(datos) ? datos : [];
            comprobar();

        });

        BFW.API.getAgenda(function(datos){

            BFW.Dashboard.citas = Array.isArray(datos) ? datos : [];
            comprobar();

        });

        BFW.API.getPersonas(function(datos){

            BFW.Dashboard.personas = Array.isArray(datos) ? datos : [];
            comprobar();

        });

        BFW.API.getEstadoSistema(function(datos){

            BFW.Dashboard.estado = datos || {};
            comprobar();

        });

        BFW.API.getActividad(8, function(datos){

            BFW.Dashboard.actividad = Array.isArray(datos) ? datos : [];
            comprobar();

        });

        if(esAdmin){

            BFW.API.getPipelineInstalaciones(function(r){

                BFW.Dashboard.pipeline = (r && r.ok) ? r : { estados: [], presupuestos: [] };
                comprobar();

            });

        } else {

            BFW.Dashboard.pipeline = { estados: [], presupuestos: [] };

        }

    };

    /**
     * Pinta una fila de "Estado del sistema" a partir de lo que ha
     * devuelto el servidor. Si de un servicio no sabemos nada, se
     * muestra como desconocido en vez de mentir diciendo que va bien.
     */
    BFW.Dashboard.filaEstado = function(nombre, info){

        const nivel = (info && info.nivel) || "desconocido";
        const detalle = (info && info.detalle) || "";

        const clases = {
            ok: "status-online",
            aviso: "status-warning",
            error: "status-offline",
            desconocido: "status-warning"
        };

        const textos = {
            ok: "Online",
            aviso: "Atención",
            error: "Sin conexión",
            desconocido: "Desconocido"
        };

        return `

            <div class="status-item">

                <span>
                    ${nombre}
                    ${detalle ? `<small style="display:block;color:var(--color-text-muted);font-size:11px;">${detalle}</small>` : ""}
                </span>

                <span class="${clases[nivel]}">● ${textos[nivel]}</span>

            </div>

        `;

    };

    BFW.Dashboard.nombrePersona = function(id){

        if(!id || !BFW.Dashboard.personas) return "Sin cliente";

        const persona = BFW.Dashboard.personas.find(function(p){ return Number(p.id) === Number(id); });

        return persona ? (persona.nombre + " " + (persona.apellidos || "")).trim() : "Cliente no encontrado";

    };

    BFW.Dashboard.hoyISO = function(){

        const hoy = new Date();
        const mes = String(hoy.getMonth()+1).padStart(2,"0");
        const dia = String(hoy.getDate()).padStart(2,"0");
        return hoy.getFullYear()+"-"+mes+"-"+dia;

    };

    /**
     * Pantalla de bienvenida que se ve mientras el panel carga sus
     * datos por primera vez. En vez del típico "Cargando..." de los
     * demás módulos, aquí se muestra la marca: logo, nombre, claim y
     * un indicador de progreso discreto.
     * Los estilos van en línea a propósito, para que no dependa de
     * tocar ningún archivo CSS.
     */
    BFW.Dashboard.renderBienvenida = function(){

        const hora = new Date().getHours();
        const saludo = hora < 6 ? "Buenas noches"
                     : hora < 13 ? "Buenos días"
                     : hora < 21 ? "Buenas tardes"
                     : "Buenas noches";

        const nombre = (BFW.Auth && BFW.Auth.usuario && BFW.Auth.usuario.nombre)
            ? BFW.Auth.usuario.nombre.split(" ")[0]
            : "";

        return `

        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:60vh;text-align:center;padding:40px 20px;">

            <!-- Isotipo de BABEX: la casa sostenida por la señal. -->
            <svg viewBox="0 0 120 120" width="96" height="96" style="margin-bottom:24px;animation:babex-bienvenida-latido 2s ease-in-out infinite;">
                <rect width="120" height="120" rx="28" fill="#16294A"/>
                <path d="M22 80 Q60 106 98 80" fill="none" stroke="#5C9DFF" stroke-width="7.5" stroke-linecap="round"/>
                <path d="M32 76 L32 51 L60 27 L88 51 L88 76 Z" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                <g fill="#ffffff">
                    <rect x="50" y="53" width="8" height="8" rx="1.3"/>
                    <rect x="62" y="53" width="8" height="8" rx="1.3"/>
                    <rect x="50" y="65" width="8" height="8" rx="1.3"/>
                    <rect x="62" y="65" width="8" height="8" rx="1.3"/>
                </g>
            </svg>

            <h1 style="margin:0;font-size:36px;font-weight:600;color:var(--color-text-primary);">Babex</h1>

            <p style="margin:6px 0 0;font-size:13px;color:#5C9DFF;letter-spacing:0.14em;text-transform:uppercase;">Smart Home Solutions</p>

            <p style="margin:26px 0 0;font-size:16px;color:var(--color-text-secondary);">
                ${saludo}${nombre ? ", " + nombre : ""}. Preparando tu centro de operaciones...
            </p>

            <div style="margin-top:22px;width:190px;height:4px;border-radius:999px;background:rgba(59,130,246,.15);overflow:hidden;">
                <div style="height:100%;width:45%;border-radius:999px;background:#3b82f6;animation:babex-bienvenida-barra 1.1s ease-in-out infinite;"></div>
            </div>

            <style>
                @keyframes babex-bienvenida-latido{
                    0%,100%{ transform:scale(1); }
                    50%{ transform:scale(1.06); }
                }
                @keyframes babex-bienvenida-barra{
                    0%{ margin-left:-45%; }
                    100%{ margin-left:100%; }
                }
            </style>

        </div>

        `;

    };

    /**
     * "hace 5 min", "hace 2 h", "ayer"... a partir de una fecha ISO.
     */
    BFW.Dashboard.hace = function(fechaISO){

        if(!fechaISO) return "";

        const entonces = new Date(fechaISO);
        const minutos = Math.floor((Date.now() - entonces.getTime()) / 60000);

        if(minutos < 1) return "ahora mismo";
        if(minutos < 60) return "hace " + minutos + " min";

        const horas = Math.floor(minutos / 60);

        if(horas < 24) return "hace " + horas + " h";

        const dias = Math.floor(horas / 24);

        if(dias === 1) return "ayer";
        if(dias < 7) return "hace " + dias + " días";

        return entonces.toLocaleDateString("es-ES");

    };

    BFW.Dashboard.renderActividad = function(){

        const actividad = BFW.Dashboard.actividad || [];

        if(!actividad.length){

            return `<p style="color:var(--color-text-secondary);">Todavía no hay actividad registrada.</p>`;

        }

        const colores = {
            "Creado": "var(--color-success, #22c55e)",
            "Editado": "var(--color-primary-500, #3b82f6)",
            "Eliminado": "var(--color-danger, #ef4444)",
            "Visita realizada": "var(--color-success, #22c55e)",
            "Visita pendiente": "var(--color-warning, #f59e0b)",
            "Visita cancelada": "var(--color-danger, #ef4444)"
        };

        return actividad.map(function(a){

            return `

                <div class="activity-item">

                    <div>

                        <div class="activity-name">
                            <span style="color:${colores[a.accion] || "var(--color-text-muted)"};">${a.accion}</span>
                            · ${a.detalle || a.modulo}
                        </div>

                        <div class="activity-date">
                            ${a.modulo} · ${a.usuario} · ${BFW.Dashboard.hace(a.fecha)}
                        </div>

                    </div>

                </div>

            `;

        }).join("");

    };

    BFW.Dashboard.euros = function(n){

        return Number(n || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";

    };

    // Columnas del pipeline. No es un mapeo 1:1 con los estados del
    // presupuesto: "Rechazado" y "Cancelada" son dos estados distintos
    // en PresupuestosService.ESTADOS_PIPELINE, pero aquí se pintan
    // juntos en una sola columna, porque a efectos de visibilidad del
    // negocio son la misma pregunta ("¿qué se ha perdido?"), solo que
    // en dos momentos distintos del ciclo (antes o después de aceptar).
    BFW.Dashboard.COLUMNAS_PIPELINE = [
        { titulo: "Enviado",              color: "#64748b", estados: ["Enviado"] },
        { titulo: "Aceptado",             color: "#3b82f6", estados: ["Aceptado"] },
        { titulo: "En ejecución",         color: "#f97316", estados: ["En ejecución"] },
        { titulo: "Ejecutada",            color: "#a855f7", estados: ["Ejecutada"] },
        { titulo: "Facturada",            color: "#06b6d4", estados: ["Facturada"] },
        { titulo: "Cobrada",              color: "#22c55e", estados: ["Cobrada"] },
        { titulo: "Rechazado / Cancelada", color: "#ef4444", estados: ["Rechazado", "Cancelada"] }
    ];

    /**
     * Pipeline de instalaciones: una columna por etapa (Enviado →
     * Aceptado → En ejecución → Ejecutada → Facturada → Cobrada, más
     * Rechazado/Cancelada al final), con sus tarjetas y el total de
     * cada una. Solo se pinta si hay algo que mostrar: sin presupuestos
     * enviados todavía, la tarjeta no aporta nada y solo ocupa sitio.
     */
    BFW.Dashboard.renderPipeline = function(){

        const pipeline = BFW.Dashboard.pipeline || { estados: [], presupuestos: [] };
        const presupuestos = pipeline.presupuestos || [];

        if(!presupuestos.length) return "";

        const columnas = BFW.Dashboard.COLUMNAS_PIPELINE.map(function(columna){

            const items = presupuestos.filter(function(p){ return columna.estados.indexOf(p.estado) !== -1; });
            const total = items.reduce(function(s, p){ return s + (Number(p.total) || 0); }, 0);
            const color = columna.color;

            const tarjetas = items.map(function(p){

                return `

                <div class="pipeline-tarjeta" style="border-left-color:${color};"
                    onclick="BFW.irAFicha('inmuebles', ${p.inmuebleId})" title="Abrir el inmueble">

                    <div class="pipeline-tarjeta-numero">${p.numero}</div>
                    <div class="pipeline-tarjeta-cliente">${p.cliente}</div>
                    ${p.direccion ? `<div class="pipeline-tarjeta-direccion">${p.direccion}</div>` : ""}
                    ${columna.estados.length > 1 ? `<div class="pipeline-tarjeta-etiqueta">${p.estado}</div>` : ""}
                    <div class="pipeline-tarjeta-total">${BFW.Dashboard.euros(p.total)}</div>

                </div>

                `;

            }).join("");

            return `

            <div class="pipeline-columna">

                <div class="pipeline-columna-cabecera" style="border-top-color:${color};">
                    <span class="pipeline-columna-nombre">${columna.titulo}</span>
                    <span class="pipeline-columna-cuenta">${items.length}</span>
                </div>

                <div class="pipeline-columna-total">${items.length ? BFW.Dashboard.euros(total) : "—"}</div>

                <div class="pipeline-columna-tarjetas">
                    ${tarjetas || `<p class="pipeline-vacio">Nada aquí ahora mismo.</p>`}
                </div>

            </div>

            `;

        }).join("");

        const totalGeneral = presupuestos.reduce(function(s, p){ return s + (Number(p.total) || 0); }, 0);

        return `

        <div class="card mt-20">

            <div class="card-title">Pipeline de instalaciones</div>

            <div class="pipeline-resumen">${presupuestos.length} presupuestos en el radar · ${BFW.Dashboard.euros(totalGeneral)}</div>

            <div class="pipeline-tablero">
                ${columnas}
            </div>

        </div>

        `;

    };

    BFW.Dashboard.render = function(){

        if(BFW.Dashboard.casos === null || BFW.Dashboard.citas === null || BFW.Dashboard.personas === null || BFW.Dashboard.estado === null || BFW.Dashboard.actividad === null || BFW.Dashboard.pipeline === null){

            const inicio = Date.now();

            BFW.Dashboard.cargarTodo(function(){

                // La primera vez, mantenemos la bienvenida en pantalla
                // un mínimo de tiempo aunque los datos ya estén, para
                // que dé tiempo a verla. Las siguientes veces entra
                // directo, sin esperas.
                if(BFW.Dashboard.bienvenidaVista){

                    BFW.App.render();
                    return;

                }

                BFW.Dashboard.bienvenidaVista = true;

                const restante = BFW.Dashboard.TIEMPO_BIENVENIDA_MS - (Date.now() - inicio);

                if(restante > 0){

                    setTimeout(function(){ BFW.App.render(); }, restante);

                } else {

                    BFW.App.render();

                }

            });

            return BFW.Dashboard.renderBienvenida();

        }

        const hoy = BFW.Dashboard.hoyISO();

        // Casos que siguen vivos (cualquier estado que no sea Cerrado).
        const casosActivos = BFW.Dashboard.casos.filter(function(c){
            return c.estado !== "Cerrado";
        }).length;

        // Citas de hoy, del tipo que sean, sin contar las canceladas.
        const citasHoy = BFW.Dashboard.citas.filter(function(c){
            return c.fecha === hoy && c.estado !== "Cancelada";
        }).length;

        // Citas de los próximos 7 días (incluido hoy). Antes esta
        // tarjeta mostraba los casos "Abierto", que ya iban contados
        // dentro de "Casos activos" — se solapaban y no aportaba.
        const limiteSemana = new Date();
        limiteSemana.setDate(limiteSemana.getDate() + 7);

        const mesL = String(limiteSemana.getMonth()+1).padStart(2,"0");
        const diaL = String(limiteSemana.getDate()).padStart(2,"0");
        const hastaISO = limiteSemana.getFullYear()+"-"+mesL+"-"+diaL;

        const citasSemana = BFW.Dashboard.citas.filter(function(c){
            return c.fecha >= hoy && c.fecha <= hastaISO && c.estado !== "Cancelada";
        }).length;

        // Incidencias sin cerrar: lo que de verdad requiere atención.
        const incidencias = BFW.Dashboard.casos.filter(function(c){
            return c.tipo === "Incidencia" && c.estado !== "Cerrado";
        }).length;

        const proximasCitas = BFW.Dashboard.citas
            .filter(function(c){
                return c.fecha >= hoy && c.estado !== "Cancelada";
            })
            .sort(function(a,b){
                return ((a.fecha||"")+" "+(a.hora||"")).localeCompare((b.fecha||"")+" "+(b.hora||""));
            })
            .slice(0,5);

        const listaCitas = proximasCitas.length === 0
            ? `<p style="color:var(--color-text-secondary);">No hay citas próximas.</p>`
            : proximasCitas.map(function(c){

                const esHoy = c.fecha === hoy ? "Hoy" : BFW.formatearFecha(c.fecha);

                return `

                <div class="activity-item">

                    <div>

                        <div class="activity-name">
                            ${c.titulo || "Cita"}
                        </div>

                        <div class="activity-date">
                            ${BFW.Dashboard.nombrePersona(c.personaId)} · ${esHoy} · ${c.hora || ""}
                        </div>

                    </div>

                </div>

                `;

            }).join("");

        return `

        <div class="dashboard">

            <div class="dashboard-title">

                <h2>${(function(){
                    const h = new Date().getHours();
                    const s = h < 6 ? "Buenas noches" : h < 13 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches";
                    const n = (BFW.Auth && BFW.Auth.usuario && BFW.Auth.usuario.nombre) ? BFW.Auth.usuario.nombre.split(" ")[0] : "";
                    return n ? (s + ", " + n + ".") : (s + ".");
                })()}</h2>

                <p>Bienvenido al centro de operaciones de BABEX.</p>

            </div>

            <div class="kpi-grid">

                <div class="kpi-card">
                    <div class="kpi-title">Casos activos</div>
                    <div class="kpi-value">${casosActivos}</div>
                </div>

                <div class="kpi-card">
                    <div class="kpi-title">Citas hoy</div>
                    <div class="kpi-value text-success">${citasHoy}</div>
                </div>

                <div class="kpi-card">
                    <div class="kpi-title">Citas esta semana</div>
                    <div class="kpi-value text-warning">${citasSemana}</div>
                </div>

                <div class="kpi-card">
                    <div class="kpi-title">Incidencias abiertas</div>
                    <div class="kpi-value text-danger">${incidencias}</div>
                </div>

            </div>

            <div class="dashboard-grid">

                <div>

                    <div class="card">

                        <div class="card-title">Próximas citas</div>

                        <div class="activity">
                            ${listaCitas}
                        </div>

                    </div>

                    ${BFW.Dashboard.renderPipeline()}

                </div>

                <div>

                    <div class="card">

                        <div class="card-title">Acciones rápidas</div>

                        <div class="quick-actions">

                            <button class="quick-button" onclick="BFW.Router.accionRapida('personas', function(){ BFW.Personas.nueva(); })">Nueva Persona</button>
                            <button class="quick-button" onclick="BFW.Router.accionRapida('casos', function(){ BFW.Casos.nuevo(); })">Nuevo Caso</button>
                            <button class="quick-button" onclick="BFW.Router.accionRapida('agenda', function(){ BFW.Agenda.nueva(); })">Nueva Cita</button>
                            <button class="quick-button" onclick="BFW.Router.accionRapida('inmuebles', function(){ BFW.Inmuebles.nueva(); })">Nuevo Inmueble</button>

                        </div>

                    </div>

                    <div class="card mt-20">

                        <div class="card-title">Actividad reciente</div>

                        <div class="activity">
                            ${BFW.Dashboard.renderActividad()}
                        </div>

                    </div>

                    <div class="card mt-20">

                        <div class="card-title">Estado del sistema</div>

                        <div class="status-list">

                            ${BFW.Dashboard.filaEstado("Drive", BFW.Dashboard.estado.drive)}

                            ${BFW.Dashboard.filaEstado("Gmail", BFW.Dashboard.estado.gmail)}

                            ${BFW.Dashboard.filaEstado("SHS_DB", BFW.Dashboard.estado.base)}

                            <div class="status-item">
                                <span>
                                    Home Assistant
                                    <small style="display:block;color:var(--color-text-muted);font-size:11px;">Sin integrar todavía</small>
                                </span>
                                <span class="status-warning">● No configurado</span>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        `;

    }
    </script>
