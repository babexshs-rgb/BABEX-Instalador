<style>

    /* Miniatura de la foto en la lista compacta: ocupa el sitio del
       icono, así que no descuadra la fila. */
.documentos-mini-thumb{

width:34px;
height:34px;
flex-shrink:0;
border-radius:var(--radius-sm);
object-fit:cover;
background:var(--color-surface-hover);

}


    /* ==================================================
       DOCUMENTOS
       (usa las variables definidas en Tokens.css.html)
    ================================================== */

.documentos-header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;

}

.documentos-header h2{

margin:0;
font-size:28px;
font-weight:700;
color:var(--color-text-primary);

}

.documentos-panel{

display:grid;
grid-template-rows:auto 1fr;
height:100%;
min-height:0;

}

.documentos-header-panel{

display:flex;
flex-direction:column;
gap:18px;

}

.documentos-toolbar{

display:flex;
align-items:center;
gap:14px;

}

.documentos-search{

position:relative;
flex:1;

}

.documentos-search-icon{

position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:var(--color-text-muted);
font-size:14px;
pointer-events:none;

}

.documentos-search .babex-input{

height:44px;
padding-left:42px;

}

.documentos-list{

overflow-y:auto;
min-height:0;
padding-right:6px;

}

/*==================================================
CHIPS FILTROS
==================================================*/

.documentos-filtros{

display:flex;
gap:8px;
margin-bottom:6px;
flex-wrap:wrap;

}

.documento-chip{

border:1px solid var(--color-border);
border-radius:var(--radius-full);
padding:8px 16px;
font-size:12px;
font-weight:700;
cursor:pointer;
color:var(--color-text-secondary);
background:var(--color-surface);
transition:.15s;

}

.documento-chip:hover{

background:var(--color-surface-hover);

}

.documento-chip.activo{

background:var(--color-primary-500);
color:#ffffff;
border-color:var(--color-primary-500);

}

/*==================================================
TARJETA LISTA
==================================================*/

.documento-list-card{

display:flex;
align-items:center;
gap:14px;
cursor:pointer;
padding:14px 16px;
border-radius:var(--radius-md);
background:var(--color-surface);
border:1px solid var(--color-border);
margin-bottom:10px;
transition:background .15s;

}

.documento-list-card:hover{

background:var(--color-surface-hover);

}

.documento-list-icono{

width:52px;
height:52px;
border-radius:var(--radius-sm);
background:var(--color-bg);
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
font-size:24px;

}

.documento-list-info{

display:flex;
flex-direction:column;
justify-content:center;
flex:1;
min-width:0;

}

.documento-list-title{

font-size:14px;
font-weight:700;
color:var(--color-text-primary);
line-height:1.3;

}

.documento-list-sub{

font-size:12px;
color:var(--color-text-secondary);
margin-top:2px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;

}

/*==================================================
FICHA DE DOCUMENTO
==================================================*/

.documento-detail{

display:flex;
flex-direction:column;
height:100%;
min-height:0;
overflow-y:auto;
padding-right:10px;

}

.documento-top{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
padding-bottom:20px;
border-bottom:1px solid var(--color-border);

}

.documento-identidad{

display:flex;
align-items:center;
gap:18px;

}

.documento-avatar-lg{

width:64px;
height:64px;
border-radius:50%;
background:var(--color-surface);
border:1px solid var(--color-border);
display:flex;
justify-content:center;
align-items:center;
font-size:26px;

}

.documento-title{

margin:0;
font-size:24px;
font-weight:700;
color:var(--color-text-primary);

}

.documento-subtitle{

margin-top:8px;
color:var(--color-text-secondary);
font-size:13px;
display:flex;
align-items:center;
gap:8px;

}

.documento-detail-row{

display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid var(--color-border);

}

.documento-detail-row:last-child{

border-bottom:none;

}

.documento-detail-row span:last-child{

color:var(--color-text-primary);
font-size:13px;

}

/*==================================================
FORMULARIO
==================================================*/

.documento-form-wrapper{

width:100%;
max-width:1100px;
margin:0 auto;
padding-bottom:40px;

}

.documento-form-section h3{

margin:0 0 20px;
font-size:16px;
color:var(--color-text-primary);

}

.documento-form-grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:4px;

}

.documento-campo label{

display:block;
margin-bottom:8px;
font-weight:700;
font-size:12px;
color:var(--color-text-secondary);

}

.documento-nota{

margin:0;
font-size:13px;
color:var(--color-text-muted);

}

.documento-tipo-detectado{

height:40px;
display:flex;
align-items:center;
padding:0 12px;
border-radius:var(--radius-sm);
border:1px solid var(--color-border);
background:var(--color-bg);
color:var(--color-text-secondary);
font-size:13px;
font-weight:700;

}

/*==================================================
SELECTOR DE VÍNCULO
==================================================*/

.documento-vinculo-selector{

display:flex;
gap:8px;
flex-wrap:wrap;

}

.documento-vinculo-btn{

border:1px solid var(--color-border);
border-radius:var(--radius-full);
padding:8px 18px;
font-size:13px;
font-weight:700;
cursor:pointer;
color:var(--color-text-secondary);
background:var(--color-surface);
transition:.15s;
font-family:var(--font-family);

}

.documento-vinculo-btn:hover{

background:var(--color-surface-hover);

}

.documento-vinculo-btn.activo{

background:var(--color-primary-500);
color:#ffffff;
border-color:var(--color-primary-500);

}

.documento-form-footer{

margin-top:24px;

}

.documento-form-buttons{

display:flex;
justify-content:flex-end;
gap:12px;

}

.documento-editor-header h2{

margin:0 0 20px;
font-size:24px;
font-weight:700;
color:var(--color-text-primary);

}

/*==================================================
MINI-LISTADO (fichas de Persona / Empresa / Caso / Inmueble)
==================================================*/

.documentos-mini-empty{

margin:0;
font-size:13px;
color:var(--color-text-muted);

}

.documentos-mini-list{

display:flex;
flex-direction:column;
gap:8px;

}

.documentos-mini-item{

display:flex;
align-items:center;
gap:10px;
padding:10px 12px;
border-radius:var(--radius-sm);
background:var(--color-bg);
border:1px solid var(--color-border);
cursor:pointer;
transition:background .15s;

}

.documentos-mini-item:hover{

background:var(--color-surface-hover);

}

.documentos-mini-icon{

font-size:16px;
flex-shrink:0;

}

.documentos-mini-nombre{

flex:1;
min-width:0;
font-size:13px;
font-weight:700;
color:var(--color-text-primary);
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;

}

.documentos-mini-badge{

flex-shrink:0;

}

.documentos-mini-fecha{

flex-shrink:0;
font-size:12px;
color:var(--color-text-muted);

}

/*==================================================
ESTADO VACÍO
==================================================*/

.documentos-empty{

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
height:100%;
padding:40px;
color:var(--color-text-secondary);

}

</style>
