<style>

    /*
    ==================================================
    BABEX
    Archivo : Tokens.css
    Versión : 1.0.0
    Sistema de variables de identidad visual (BRAND-002)
    ==================================================
    */

    :root{

        /* Fondo y superficies - modo oscuro (por defecto) */
        --color-bg:#0B1220;
        --color-surface:#17212F;
        --color-surface-hover:#1E2A3A;
        --color-border:rgba(255,255,255,0.08);

        /* Texto - modo oscuro */
        --color-text-primary:#F5F7FA;
        --color-text-secondary:#8B99AC;
        --color-text-muted:#64748B;

        /* Color primario BABEX (común a ambos modos) */
        --color-primary-100:#85B7EB;
        --color-primary-400:#378ADD;
        --color-primary-500:#3D6BFF;
        --color-primary-600:#185FA5;
        --color-primary-900:#0C447C;

        /* Estados (común a ambos modos) */
        --color-success:#22C55E;
        --color-warning:#F59E0B;
        --color-danger:#EF4444;

        /* Barra lateral - siempre en el tono oscuro de marca */
        --color-sidebar-bg:#17212F;
        --color-sidebar-text:#8B99AC;
        --color-sidebar-text-active:#F5F7FA;
        --color-sidebar-item-active-bg:rgba(61,107,255,0.18);

        /* Tipografía */
        --font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;

        /* Radios */
        --radius-sm:8px;
        --radius-md:12px;
        --radius-lg:16px;
        --radius-full:999px;

        /* Espaciados */
        --space-xs:4px;
        --space-sm:8px;
        --space-md:16px;
        --space-lg:24px;
        --space-xl:32px;

    }

    [data-theme="light"]{

        --color-bg:#F4F6F9;
        --color-surface:#FFFFFF;
        --color-surface-hover:#EEF2F7;
        --color-border:#E2E8F0;

        --color-text-primary:#101828;
        --color-text-secondary:#667085;
        --color-text-muted:#94A3B8;

        /* La barra lateral se mantiene oscura también en modo claro */
        --color-sidebar-bg:#17212F;
        --color-sidebar-text:#8B99AC;
        --color-sidebar-text-active:#F5F7FA;
        --color-sidebar-item-active-bg:rgba(61,107,255,0.18);

    }

    /* ==================================================
       COMPONENTES BASE COMUNES (usan los tokens de arriba)
    ================================================== */

    body{

        font-family:var(--font-family);
        background:var(--color-bg);
        color:var(--color-text-primary);

    }

    .babex-card{

        background:var(--color-surface);
        border:1px solid var(--color-border);
        border-radius:var(--radius-md);
        padding:var(--space-md);

    }

    .babex-overline{

        font-size:11px;
        font-weight:700;
        letter-spacing:0.08em;
        text-transform:uppercase;
        color:var(--color-text-muted);

    }

    .babex-badge{

        display:inline-block;
        border-radius:var(--radius-full);
        font-size:12px;
        font-weight:700;
        padding:3px 10px;

    }

    .babex-badge-success{

        background:rgba(34,197,94,0.15);
        color:var(--color-success);

    }

    .babex-badge-warning{

        background:rgba(245,158,11,0.15);
        color:var(--color-warning);

    }

    .babex-badge-danger{

        background:rgba(239,68,68,0.15);
        color:var(--color-danger);

    }

    .babex-btn-primary{

        background:var(--color-primary-500);
        color:#ffffff;
        border:none;
        border-radius:var(--radius-full);
        padding:8px 18px;
        font-weight:700;
        font-size:13px;
        cursor:pointer;

    }

    .babex-btn-primary:hover{

        background:var(--color-primary-600);

    }

    .babex-btn-secondary{

        background:transparent;
        color:var(--color-text-primary);
        border:1px solid var(--color-border);
        border-radius:var(--radius-full);
        padding:8px 18px;
        font-weight:700;
        font-size:13px;
        cursor:pointer;

    }

    .babex-btn-secondary:hover{

        background:var(--color-surface-hover);

    }

    .babex-btn-danger{

        background:transparent;
        color:var(--color-danger);
        border:1px solid var(--color-danger);
        border-radius:var(--radius-full);
        padding:8px 18px;
        font-weight:700;
        font-size:13px;
        cursor:pointer;

    }

    .babex-btn-danger:hover{

        background:rgba(239,68,68,0.12);

    }

    .babex-input{

        width:100%;
        height:40px;
        border-radius:var(--radius-sm);
        border:1px solid var(--color-border);
        background:var(--color-surface);
        color:var(--color-text-primary);
        padding:0 12px;
        font-family:var(--font-family);
        font-size:13px;

    }

    .babex-input:focus{

        outline:none;
        border-color:var(--color-primary-500);

    }

    textarea.babex-input{

        height:auto;
        padding:10px 12px;
        resize:none;

    }

</style>
