<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<!--
  maximum-scale=1 + user-scalable=no: es la corrección directa a la
  queja "tenía que ampliar continuamente la pantalla para ver los
  campos". En vez de impedir el zoom y dejar los controles pequeños
  como estaban, aquí además todo el CSS (app.css) sube el tamaño base
  de letra y controles para que ampliar deje de hacer falta.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16294A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Babex">
<meta name="description" content="App del instalador Babex: visitas asignadas y captura de datos en campo, con y sin conexión.">

<title>Babex Instalador</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">

</head>
<body>

<div id="app">
  <div class="pantalla-centrada">
    <div class="spinner"></div>
    <p>Cargando...</p>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/db.js"></script>
<script src="/js/api.js"></script>
<script src="/js/sync.js"></script>
<script src="/js/app.js"></script>

<script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function (error) {
        console.warn("No se pudo registrar el service worker:", error);
      });
    });
  }

</script>

</body>
</html>
